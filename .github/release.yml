changelog:
  exclude:
    labels:
      - ignore-for-release
      - chore
  categories:
    - title: "🚨 Breaking Changes"
      labels:
        - breaking-change
    - title: "✨ New Skills & Plugins"
      labels:
        - enhancement
        - feature
    - title: "🐛 Bug Fixes"
      labels:
        - bug
        - fix
    - title: "📖 Documentation"
      labels:
        - documentation
    - title: "🔧 Maintenance"
      labels:
        - dependencies
        - automated
    - title: "Other Changes"
      labels:
        - "*"
